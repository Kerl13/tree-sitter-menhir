[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { name = "Martin Pépin" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Menhir grammar for tree-sitter with OCaml language injection"
keywords = [ "incremental", "parsing", "tree-sitter", "menhir" ]
license.text = "MIT"
name = "tree-sitter-menhir"
readme = "README.md"
requires-python = ">=3.10"
version = "0.6.1"

[project.urls]
Homepage = "https://github.com/Kerl13/tree-sitter-menhir"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
