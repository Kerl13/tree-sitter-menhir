[package]
authors = [ "Martin Pépin" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Menhir grammar for tree-sitter with OCaml language injection"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "menhir" ]
license = "MIT"
name = "tree-sitter-menhir"
readme = "README.md"
repository = "https://github.com/Kerl13/tree-sitter-menhir"
version = "0.6.1"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
